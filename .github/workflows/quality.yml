name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vulnerabilities:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=web/pnpm-lock.yaml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  edge-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/supabase/functions/validate-visit
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.12
      - run: deno task check

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.98.1
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: supabase test db
      - run: bash supabase/tests/edge_function_e2e.sh
      - run: supabase db advisors --local --type all --level warn --fail-on error
      - run: supabase db lint --local --schema public,private --level warning --fail-on error
